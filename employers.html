<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect | The Sales Floor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="canonical" href="https://thesalesfloor.biz/employers" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="partials.js" defer></script>
</head>
<body>

  <div data-partial="header"></div>
  <noscript>
    <header>
      <nav>
        <a href="/" class="logo">
          <svg class="flame" viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M20 2C20 12 7 15 7 28C7 38 13 46 21 50C17 44 15 37 19 30C21 34 25 36 27 32C29 39 34 41 34 32C34 24 27 20 27 12C27 19 23 19 23 14C23 7 20 6 20 2Z" />
          </svg>
          The Sales Floor
        </a>
        <div class="nav-links">
          <a href="/candidates" class="nav-btn">For Candidates</a>
          <a href="/employers" class="nav-btn active">For Employers</a>
        </div>
      </nav>
    </header>
  </noscript>

  <main>
    <div class="form-page form-page--narrow">
      <div class="form-header">
        <h1>Connect with us</h1>
        <p class="lead">The Sales Floor is building the best network of B2B sales talent in the world. Let's get connected as we build our talent pool.</p>
      </div>

      <form id="employer-intake-form" novalidate>
        <div class="field">
          <label for="company-name">Business Name <span class="req">*</span></label>
          <input type="text" id="company-name" name="company_name" placeholder="Acme Corp" required />
        </div>
        <div class="field">
          <label for="contact-email">Email <span class="req">*</span></label>
          <input type="email" id="contact-email" name="contact_email" placeholder="you@company.com" required />
        </div>
        <div class="field">
          <label for="contact-phone">Phone <span class="optional">(optional)</span></label>
          <input type="tel" id="contact-phone" name="contact_phone" placeholder="+1 (555) 000-0000" />
        </div>

        <button type="submit" class="btn-submit">Let's Connect</button>
      </form>

      <!-- Success state -->
      <div id="employer-success" class="success" hidden>
        <div class="success-icon">✓</div>
        <h2>We're Connected</h2>
        <p>We'll be in touch personally. Talk soon.</p>
      </div>
    </div>
  </main>

  <div data-partial="footer"></div>
  <noscript>
    <footer>
      <p>&copy; 2026 The Sales Floor. All rights reserved. <a href="/privacy">Privacy Policy</a></p>
    </footer>
  </noscript>

  <script src="employers.js"></script>
</body>
</html>
