services:
  - type: web
    name: salesfloor-api
    env: python
    rootDir: backend
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    # --workers 3: gunicorn defaults to a single worker, which meant one slow
    # request (an AI ranking call blocking on Claude for many seconds) made
    # the whole site -- public forms, admin, everything -- unresponsive until
    # it finished. With multiple workers, a ranking call only ties up one of
    # them. Watch memory in Render's metrics after this deploys (starter plan
    # is 512MB) and lower this if it's tight.
    startCommand: "gunicorn salesfloor.wsgi:application --timeout 90 --workers 3"
    disk:
      name: resumes
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: salesfloor-api.onrender.com
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: salesfloor-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTOMATION_API_KEY
        sync: false
      - key: SITE_BASE_URL
        value: https://salesfloor-api.onrender.com
      - key: CALENDLY_SCHEDULING_URL
        sync: false
      - key: N8N_INVITE_WEBHOOK_URL
        sync: false

databases:
  - name: salesfloor-db
    plan: basic-256mb
