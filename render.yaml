services:
  - type: web
    name: salesfloor-api
    env: python
    rootDir: backend
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    # --workers 3: gunicorn defaults to a single worker, which meant one slow
    # request (an AI ranking call blocking on Claude for many seconds) made
    # the whole site -- public forms, admin, everything -- unresponsive until
    # it finished. With multiple workers, a ranking call only ties up one of
    # them. Watch memory in Render's metrics after this deploys (starter plan
    # is 512MB) and lower this if it's tight.
    startCommand: "gunicorn salesfloor.wsgi:application --timeout 90 --workers 3"
    disk:
      name: resumes
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: salesfloor-api.onrender.com
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: salesfloor-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTOMATION_API_KEY
        sync: false
      - key: SITE_BASE_URL
        value: https://salesfloor-api.onrender.com
      - key: CALENDLY_SCHEDULING_URL
        sync: false
      - key: N8N_INVITE_WEBHOOK_URL
        sync: false
      - key: N8N_SUBMIT_WEBHOOK_URL
        sync: false

  # Self-hosted n8n (chosen over n8n Cloud: flat-rate, no execution cap --
  # see conversation history for the cost/ops comparison). Base recipe is
  # Render's own official template (render-examples/n8n), upgraded from its
  # free-tier defaults to paid plans -- Render's free Postgres is deleted
  # after 30 days (same gotcha as salesfloor-db below) and the free web
  # service tier spins down on idle, which would silently kill webhook/
  # schedule responsiveness.
  #
  # plan is `standard` (2GB), not `starter` (512MB): n8n on Node/V8 tries to
  # grow its heap toward its default ~1.5GB target regardless of container
  # size, so 512MB isn't enough for it to even finish booting -- confirmed
  # in production, the first deploy at `starter` crash-looped with "FATAL
  # ERROR: ... JavaScript heap out of memory". NODE_OPTIONS below caps the
  # heap explicitly (n8n's own recommended fix) so it fails predictably
  # rather than creeping toward that default again if this ever gets
  # redeployed on a smaller plan by mistake.
  - type: web
    name: salesfloor-n8n
    runtime: image
    plan: standard
    image:
      url: docker.io/n8nio/n8n:latest
    healthCheckPath: /healthz
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
      # Do not modify after first deploy -- doing so makes every stored
      # credential (Gmail OAuth, header-auth secrets) unreadable.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        value: salesfloor-n8n.onrender.com
      - key: WEBHOOK_URL
        value: https://salesfloor-n8n.onrender.com/
      - key: GENERIC_TIMEZONE
        value: America/New_York
      # Keeps the executions table from growing forever -- 14 days is
      # enough to debug a failure without unbounded disk growth.
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "336"

databases:
  - name: salesfloor-db
    plan: basic-256mb
  # n8n's own workflow/credential/execution storage. No disk on the web
  # service above -- everything n8n needs to persist lives here instead,
  # same reasoning as why the Django resume disk exists and this doesn't.
  - name: n8n-db
    plan: basic-256mb
