<tr id="contact-row-{{ contact.id }}" class="border-t border-neutral-100">
  <td class="py-2">{{ contact.name }}</td>
  <td class="py-2 text-neutral-500">{{ contact.title|default:"—" }}</td>
  <td class="py-2">{% if contact.email %}<a href="mailto:{{ contact.email }}" class="text-brand hover:underline">{{ contact.email }}</a>{% else %}—{% endif %}</td>
  <td class="py-2 text-neutral-500">{{ contact.phone|default:"—" }}</td>
  <td class="py-2 text-right whitespace-nowrap">
    {% if active_contact_campaigns %}
    <form hx-post="{% url 'portal-create-enrollment' %}" hx-target="#enroll-status-{{ contact.id }}" hx-swap="innerHTML"
          class="inline-flex items-center gap-1 mr-3">
      <input type="hidden" name="contact_id" value="{{ contact.id }}">
      <select name="campaign_id" class="border border-neutral-300 rounded px-1 py-0.5 text-xs">
        {% for c in active_contact_campaigns %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
      </select>
      <button type="submit" class="text-xs font-semibold text-brand hover:underline">Add to campaign</button>
    </form>
    <span id="enroll-status-{{ contact.id }}" class="text-xs mr-3"></span>
    {% endif %}
    <a href="#" hx-get="{% url 'portal-contact-edit' contact.id %}" hx-target="#contact-row-{{ contact.id }}" hx-swap="outerHTML"
       class="text-xs text-neutral-500 hover:underline mr-2">Edit</a>
    <form hx-post="{% url 'portal-contact-delete' contact.id %}" hx-target="#contact-list" hx-swap="outerHTML"
          onsubmit="return confirm('Remove {{ contact.name }}?');" class="inline">
      {% csrf_token %}
      <button type="submit" class="text-xs text-red-700 hover:underline">Delete</button>
    </form>
  </td>
</tr>
